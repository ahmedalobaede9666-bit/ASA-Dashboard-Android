name: Build ASA Dashboard APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'ASA_Dashboard_Android_v*_MobileBuild.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Select latest Android package
        shell: bash
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -name 'ASA_Dashboard_Android_v*_MobileBuild.zip' | sort -V | tail -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "No ASA Android MobileBuild ZIP found"
            exit 1
          fi
          echo "ANDROID_ZIP=$ZIP_FILE" >> "$GITHUB_ENV"
          echo "Using: $ZIP_FILE"

      - name: Extract Android project
        shell: bash
        run: |
          rm -rf extracted-android
          mkdir -p extracted-android
          unzip -q "$ANDROID_ZIP" -d extracted-android
          PROJECT_DIR=$(dirname "$(find extracted-android -name settings.gradle -type f | head -n 1)")
          if [ -z "$PROJECT_DIR" ] || [ ! -f "$PROJECT_DIR/settings.gradle" ]; then
            echo "Android project not found inside ZIP"
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project: $PROJECT_DIR"

      - name: Build Debug APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug

      - name: Prepare APK
        shell: bash
        run: |
          mkdir -p apk
          cp "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" apk/ASA-Dashboard-v0.3.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ASA-Dashboard-Android-v0.3
          path: apk/ASA-Dashboard-v0.3.apk

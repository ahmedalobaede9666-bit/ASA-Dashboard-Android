name: Deploy ASA Dashboard PWA

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'ASA_Dashboard_PWA_v0.1_MobileDeploy.zip'
      - '.github/workflows/pwa-pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract PWA package
        shell: bash
        run: |
          ZIP_FILE="ASA_Dashboard_PWA_v0.1_MobileDeploy.zip"
          if [ ! -f "$ZIP_FILE" ]; then
            echo "PWA ZIP not found: $ZIP_FILE"
            exit 1
          fi
          rm -rf pwa-site
          mkdir -p pwa-site
          unzip -q "$ZIP_FILE" -d pwa-site
          INDEX_FILE=$(find pwa-site -name index.html -type f | head -n 1)
          if [ -z "$INDEX_FILE" ]; then
            echo "index.html not found inside PWA ZIP"
            exit 1
          fi
          SITE_DIR=$(dirname "$INDEX_FILE")
          echo "SITE_DIR=$SITE_DIR" >> "$GITHUB_ENV"
          echo "Publishing: $SITE_DIR"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.SITE_DIR }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
